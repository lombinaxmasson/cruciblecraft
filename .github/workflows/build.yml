name: Build

on:
  push:
    tags-ignore: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Assemble production artifacts
        run: ./gradlew assemble --no-daemon

      - name: Verify no common→client imports
        run: |
          if grep -R --include='*.java' 'com\.masson\.cruciblecraft\.client' src/main/java \
            --exclude-dir=client; then
            echo "Common code must not import client packages" >&2
            exit 1
          fi
          echo "OK: no common→client imports"

      - name: Fetch comparison base
        if: github.event_name == 'pull_request'
        run: git fetch origin ${{ github.base_ref }} --no-tags

      - name: Run developer verification
        run: python3 tools/verify.py dev
