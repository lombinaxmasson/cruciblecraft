name: Build

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "v*"
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Assemble production artifacts
        run: ./gradlew assemble

      - name: Verify no common→client imports
        run: |
          if grep -R --include='*.java' 'com\.masson\.cruciblecraft\.client' src/main/java \
            --exclude-dir=client; then
            echo "Common code must not import client packages" >&2
            exit 1
          fi
          echo "OK: no common→client imports"

      - name: Verify active tooling
        run: python3 tools/verify.py integration --profile verification

      - name: Verify runtime Java
        run: python3 tools/verify.py integration --profile runtime-java --if-changed

      - name: Verify recipe generators
        run: python3 tools/verify.py integration --profile recipe-generators --if-changed

      - name: Verify recipes
        run: python3 tools/verify.py integration --profile recipes --if-changed

      - name: Verify semantic generators
        run: python3 tools/verify.py integration --profile semantic-generators --if-changed

      - name: Verify capability runtime
        run: python3 tools/verify.py integration --profile capability-runtime
