name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # This is needed to be able to run ./gradlew below
      # You can run `git update-index --chmod +x gradlew` then remove this step.
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build and run Java unit tests
        run: ./gradlew build --no-daemon

      - name: Verify deterministic generated data
        run: |
          ./gradlew runData --no-daemon
          git diff --exit-code -- src/generated/resources
          test -z "$(git status --porcelain --untracked-files=all -- src/generated/resources)"
          ./gradlew runData --no-daemon
          git diff --exit-code -- src/generated/resources
          test -z "$(git status --porcelain --untracked-files=all -- src/generated/resources)"

      - name: Test GT6 recipe normalizer
        run: python3 -m unittest discover -s tools/tests -p 'test_*.py'

      - name: Verify normalized GT6 ore dictionary import
        run: python3 tools/import_gt6_oredict.py --check --reference-only

      - name: Verify GT6 recipe, process, and roadmap baselines
        run: python3 tools/compare_gt6_recipes.py --check --reference-only

      - name: Run NeoForge GameTest server
        run: ./gradlew runGameTestServer --no-daemon

      - name: Verify no common→client imports
        run: |
          if grep -R --include='*.java' 'com\.masson\.cruciblecraft\.client' src/main/java \
            --exclude-dir=client; then
            echo "Common code must not import client packages" >&2
            exit 1
          fi
          echo "OK: no common→client imports"