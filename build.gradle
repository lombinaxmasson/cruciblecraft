    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    systemProperty 'cruciblecraft.writeT43Measurements', 'true'
    filter {
        includeTestsMatching 'com.masson.cruciblecraft.recipe.gt.CompactRecipeFamilyT43MeasurementHarness'
