plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.142'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')
    // Offline, reviewed ore-chain recipes are owned by Python tooling.
    srcDir('src/ore_chain_generated/resources')
    // Semantic vein sources compile to runtime worldgen resources offline.
    srcDir('src/worldgen_generated/resources')
    // T9 ledger-backed ore veins and finite fluid deposits.
    srcDir('src/worldgen_catalog_generated/resources')
    // Compact component sources compile to runtime material-rule recipes offline.
    srcDir('src/component_rule_generated/resources')
    // Audited chemical fluids and recipes are generated from pinned GT6 data.
    srcDir('src/chemical_recipe_generated/resources')
    // Hydrocarbon processing and fuel rows are fixed-source projections.
    srcDir('src/hydrocarbon_recipe_generated/resources')
    // Petroleum processing rows from distillery and chemical denominator families.
    srcDir('src/petroleum_recipe_generated/resources')
    // Shared compact publication/dedup datapack resources (not family JSON).
    srcDir('src/compact_recipe_policy_generated/resources')
    // Semantic-wave compact families (slug paths, not tXX).
    srcDir('src/recipe_generated/resources')
    srcDir('src/recipe_support_generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("data/cruciblecraft/recipe/player_path_recovery/roaster/**")
    // HashCache lives at <resourcesSrcDir>/.cache; the old src/generated/**/.cache
    // pattern never matched that relative path, so cache files shipped in the jar.
    exclude("**/.cache")
    exclude("**/.cache/**")
    exclude("**/.gitkeep")
}

tasks.withType(ProcessResources).configureEach {
    // Empty material/tag directory shells are not runtime resources.
    includeEmptyDirs = false
}

repositories {
    maven {
        name = 'NeoForgedCdn'
        url = 'https://neoforged.forgecdn.net/releases'
        content {
            includeGroupByRegex 'net\\.neoforged(\\..*)?'
        }
    }
    mavenCentral()
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven {
        name = 'LatvianMods'
        url = 'https://maven.latvian.dev/releases'
        content {
            includeGroup 'dev.latvian.mods'
            includeGroup 'dev.latvian.apps'
        }
    }
    maven {
        name = 'JitPack'
        url = 'https://jitpack.io'
        content {
            includeGroup 'com.github.rtyley'
        }
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            if (providers.gradleProperty('optionalCompat').orNull == 'ccOnly') {
                gameDirectory = project.file('run-optional-compat-client')
            } else if (providers.gradleProperty('optionalCompat').orNull == 'optional') {
                gameDirectory = project.file('run-optional-compat-client-optional')
            } else if (providers.gradleProperty('wireCodecSmoke').orNull == 'dedicated') {
                // Isolated from run/ so dedicated runServer can keep session.lock.
                gameDirectory = project.file('run-wire-codec-client')
                programArgument '--quickPlayMultiplayer'
                programArgument '127.0.0.1:25566'
            } else if (providers.gradleProperty('clientSmoke').isPresent()) {
                systemProperty 'cruciblecraft.clientSmoke',
                        providers.gradleProperty('clientSmoke').get()
                systemProperty 'cruciblecraft.clientSmokeExit', 'true'
                systemProperty 'cruciblecraft.smokeReceipt',
                        providers.gradleProperty('smokeReceipt')
                                .getOrElse(file('build/verification/receipts/client-smoke.json')
                                        .absolutePath)
                systemProperty 'cruciblecraft.smokeNonce',
                        providers.gradleProperty('smokeNonce').getOrElse('')
                systemProperty 'cruciblecraft.playerCapability',
                        providers.gradleProperty('playerCapability').getOrElse('')
                gameDirectory = project.file('run-client-smoke')
            }
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            if (providers.gradleProperty('optionalCompat').orNull == 'ccOnly') {
                gameDirectory = project.file('run-optional-compat-server')
            } else if (providers.gradleProperty('optionalCompat').orNull == 'optional') {
                gameDirectory = project.file('run-optional-compat-optional')
            } else if (providers.gradleProperty('wireCodecSmoke').orNull == 'dedicated') {
                gameDirectory = project.file('run-wire-codec-server')
            }
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            jvmArgument '-Xmx4G'
            if (providers.gradleProperty('scale').isPresent()) {
                // Isolate the scale harness from the daily GameTest grid.
                systemProperty 'neoforge.enabledGameTestNamespaces', 'cruciblecraft_scale'
                gameDirectory = project.file('run-scale')
            } else if (providers.gradleProperty('recipeCensus').isPresent()) {
                // Isolate the runtime registry census gate from the daily grid.
                systemProperty 'neoforge.enabledGameTestNamespaces', 'cruciblecraft_census'
                gameDirectory = project.file('run-recipe-census')
            } else if (providers.gradleProperty('waveRecipes').isPresent()) {
                def waveSlug = providers.gradleProperty('waveRecipes').get()
                if (waveSlug ==~ /(?i)t\d{1,2}.*/) {
                    throw new GradleException(
                            "semantic -PwaveRecipes rejects milestone token ${waveSlug}")
                }
                def waveNs = 'cruciblecraft_wave_' + waveSlug.replace('/', '_').replace('-', '_')
                systemProperty 'neoforge.enabledGameTestNamespaces', waveNs
                gameDirectory = project.file('run-wave-' + waveSlug.replace('/', '-'))
            } else if (providers.gradleProperty('gameTestNamespaces').isPresent()) {
                systemProperty 'neoforge.enabledGameTestNamespaces',
                        providers.gradleProperty('gameTestNamespaces').get()
                gameDirectory = project.file('run-game-test-filtered')
            } else {
                systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            }
            if (providers.gradleProperty('clientSmoke').isPresent()) {
                systemProperty 'cruciblecraft.clientSmoke',
                        providers.gradleProperty('clientSmoke').get()
                systemProperty 'cruciblecraft.smokeReceipt',
                        providers.gradleProperty('smokeReceipt')
                                .getOrElse(file('build/verification/receipts/gametest-smoke.json')
                                        .absolutePath)
                systemProperty 'cruciblecraft.smokeNonce',
                        providers.gradleProperty('smokeNonce').getOrElse('')
                systemProperty 'cruciblecraft.playerCapability',
                        providers.gradleProperty('playerCapability').getOrElse('')
            }
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            def datagenOutput = providers.gradleProperty('datagenOutput')
                    .map { file(it) }
                    .getOrElse(file('src/generated/resources/'))
            programArguments.addAll '--mod', project.mod_id, '--all', '--output',
                    datagenOutput.getAbsolutePath(), '--existing',
                    file('src/main/resources/').getAbsolutePath(),
                    '--existing',
                    file('src/generated/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
            if (providers.gradleProperty('materialStressScenario').isPresent()) {
                systemProperty 'cruciblecraft.materialStressScenario',
                        providers.gradleProperty('materialStressScenario').get()
                systemProperty 'cruciblecraft.materialStressCount',
                        providers.gradleProperty('materialStressCount').getOrElse('20000')
            }
            if (providers.gradleProperty('scale').isPresent()) {
                systemProperty 'cruciblecraft.scale',
                        providers.gradleProperty('scale').get()
                systemProperty 'cruciblecraft.scale.output',
                        project.file('tools/scale_samples').absolutePath
            }
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

def normalizeResourceJsonNewlines = tasks.register(
        'normalizeResourceJsonNewlines') {
    group = 'verification'
    description = 'Normalizes resource JSON files to repository LF endings.'
    doLast {
        fileTree('src') {
            include '**/*.json'
        }.files.each { generated ->
            String original = generated.getText('UTF-8')
            String normalized = original
                    .replace('\r\n', '\n')
                    .replace('\r', '\n')
            if (normalized != original) {
                generated.write(normalized, 'UTF-8')
            }
        }
    }
}

tasks.named('runData').configure {
    doFirst {
        // Isolated runs may wipe their own output directory. The committed
        // generated tree also holds Python block-art models and must not be
        // deleted unconditionally.
        def isolated = providers.gradleProperty('datagenOutput')
        if (isolated.isPresent()) {
            def output = file(isolated.get())
            def committed = file('src/generated/resources')
            if (output.canonicalFile != committed.canonicalFile) {
                delete output
            }
        }
    }
    doLast {
        // HashCache drops previously Java-emitted gt_block/gt_stone models
        // when this run only references Python files via getExistingFile.
        def isolated = providers.gradleProperty('datagenOutput')
        def committed = file('src/generated/resources')
        def isolatedRun = isolated.isPresent() &&
                file(isolated.get()).canonicalFile != committed.canonicalFile
        if (!isolatedRun) {
            exec {
                commandLine 'python', 'tools/build_block_art.py', '--write'
                workingDir rootDir
            }
        }
    }
    finalizedBy normalizeResourceJsonNewlines
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    // Always declare localRuntime so -PoptionalCompat=ccOnly can still parse
    // dependencies { localRuntime ... } without putting EMI/Jade on the run.
    localRuntime
    if (providers.gradleProperty('optionalCompat').orNull != 'ccOnly') {
        runtimeClasspath.extendsFrom localRuntime
    }
}

dependencies {
    compileOnly 'maven.modrinth:jade:15.10.0+neoforge'
    compileOnly 'maven.modrinth:emi:1.1.24+1.21.1+neoforge'
    compileOnly 'dev.latvian.mods:kubejs-neoforge:2101.7.2-build.368'
    // Dev-only: load optional recipe/HUD mods in runClient without shipping them.
    localRuntime 'maven.modrinth:jade:15.10.0+neoforge'
    localRuntime 'maven.modrinth:emi:1.1.24+1.21.1+neoforge'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'com.mojang:datafixerupper:8.0.16'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Material-rule codec and projection tests exercise the real Minecraft recipe
// types instead of parallel test DTOs.
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath

// Recipe-load prototypes are deliberately isolated from production Minecraft types.
sourceSets {
    recipeLoadBenchmark {
        java.srcDir('src/recipeLoadBenchmark/java')
    }
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    maxHeapSize = '6g'
    filter {
        excludeTestsMatching 'com.masson.cruciblecraft.recipe.gt.OrdinaryCloseoutIntegratedMeasurementHarness'
    }
}

tasks.register('materialRegistryStress', JavaExec) {
    group = 'verification'
    description = 'Runs one manual 20k material registry stress scenario.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.masson.cruciblecraft.material.MaterialRegistryStressHarness'
    args providers.gradleProperty('stressScenario').getOrElse('metadata_only')
    jvmArgs '-Xmx4G'
}

tasks.register('capacityMatcherBenchmark', JavaExec) {
    group = 'verification'
    description = 'Refreshes the repeatable CapacityMatcher benchmark artifact.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.masson.cruciblecraft.recipe.gt.CapacityMatcherBenchmarkHarness'
    args file('tools/capacity_matcher_benchmark.json').absolutePath
}

tasks.register('recipeLoadContractTest', JavaExec) {
    group = 'verification'
    description = 'Runs isolated recipe-load materialization candidate contract tests.'
    dependsOn tasks.named('recipeLoadBenchmarkClasses')
    classpath = sourceSets.recipeLoadBenchmark.runtimeClasspath
    mainClass = 'com.masson.cruciblecraft.benchmark.recipe.RecipeFamilyProviderContractTest'
}

def recipeLoadBenchmarkRaw = tasks.register(
        'recipeLoadBenchmarkRaw', JavaExec) {
    group = 'verification'
    description = 'Collects recipe-load measurements from actual compact relations.'
    dependsOn tasks.named('recipeLoadBenchmarkClasses')
    classpath = sourceSets.recipeLoadBenchmark.runtimeClasspath
    mainClass = 'com.masson.cruciblecraft.benchmark.recipe.RecipeLoadBenchmarkHarness'
    args file('build/recipe-load-benchmark/raw_measurements.json').absolutePath,
            file('tools/recipe_load_materialization_policy.json').absolutePath,
            projectDir.absolutePath,
            file('build/recipe-load-benchmark/jfr').absolutePath
    jvmArgs '-Xms256m', '-Xmx2G', '-XX:+UseG1GC'
    inputs.files file('tools/recipe_load_materialization_policy.json'),
            file('tools/extruder_compact.json')
    outputs.file file('build/recipe-load-benchmark/raw_measurements.json')
}

def materializationMeasurement = { String taskName, String harness, String writeProperty, String description, boolean largeHeap = false ->
    tasks.register(taskName, Test) {
        group = 'verification'
        it.description = description
        dependsOn tasks.named('testClasses')
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        useJUnitPlatform()
        if (largeHeap) {
            maxHeapSize = '6g'
        }
        systemProperty "cruciblecraft.${writeProperty}", 'true'
        filter {
            includeTestsMatching harness
        }
    }
}

