def t14RecipeLoadBenchmarkArtifact = tasks.register(
        't14RecipeLoadBenchmarkArtifact', Exec) {
    group = 'verification'
    description = 'Validates T14c evidence and derives the production winner.'
    dependsOn t14RecipeLoadBenchmarkRaw
    commandLine providers.gradleProperty('pythonExecutable').getOrElse('python'),
            file('tools/build_t14_recipe_load_benchmark.py').absolutePath,
            '--raw',
            file('build/t14-benchmark/raw_measurements.json').absolutePath
    inputs.files file('build/t14-benchmark/raw_measurements.json'),
            file('tools/t14_materialization_policy.json'),
            file('tools/t14_extruder_compact.json'),
            file('tools/build_t14_recipe_load_benchmark.py')
    outputs.file file('tools/t14_materialization_decision.json')
}

tasks.register('t14RecipeLoadBenchmark') {
    group = 'verification'
    description = 'Refreshes actual compact T14c materialization measurements.'
    dependsOn t14RecipeLoadBenchmarkArtifact
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// Beta distribution bundle: the mod jar plus the player-facing docs
// (install guide, changelog, credits). Deterministic and clean-checkout
// reproducible; run with `.\gradlew.bat distBeta`.
tasks.register('distBeta', Zip) {
    group = 'distribution'
    description = 'Bundle the mod jar with player-facing documentation.'
    dependsOn jar
    archiveBaseName = mod_id
    archiveVersion = mod_version
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from(jar)
    from('.') {
        include 'CHANGELOG.md'
        include 'CREDITS.md'
        include 'NOTICE'
        include 'LICENSE'
        include 'docs/**'
    }
}
