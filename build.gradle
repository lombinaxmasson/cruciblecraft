plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.142'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')
    // Offline, reviewed ore-chain recipes are owned by Python tooling.
    srcDir('src/ore_chain_generated/resources')
    // Semantic vein sources compile to runtime worldgen resources offline.
    srcDir('src/worldgen_generated/resources')
    // T9 ledger-backed ore veins and finite fluid deposits.
    srcDir('src/worldgen_catalog_generated/resources')
    // Compact component sources compile to runtime material-rule recipes offline.
    srcDir('src/component_rule_generated/resources')
    // Audited T5 chemical fluids and recipes are generated from pinned GT6 data.
    srcDir('src/t5_chemical_generated/resources')
    // T21 template-backed ordinary chemistry families.
    srcDir('src/t21_chemical_generated/resources')
    // T11 hydrocarbon processing and fuel rows are fixed-source projections.
    srcDir('src/t11_hydrocarbon_generated/resources')
    // T22 petroleum processing rows from distillery + T21 denominator families.
    srcDir('src/t22_petroleum_generated/resources')
    // T37 Assembler compact families from the frozen R0 source.
    srcDir('src/t37_recipe_generated/resources')
    // T38 Roaster compact families from the frozen R0 source.
    srcDir('src/t38_recipe_generated/resources')
    // T39 Centrifuge compact families from the immutable production lock.
    srcDir('src/t39_recipe_generated/resources')
    // T39 production-lock support slice; the withdrawn broad recovery tree is excluded.
    srcDir('src/t39_support_generated/resources')
    // T40 Electrolyzer compact families from the immutable production lock.
    srcDir('src/t40_recipe_generated/resources')
    // T40 production-lock support slice; catalog fixture is excluded.
    srcDir('src/t40_support_generated/resources')
    // T41 Assembler compact families from the immutable production lock.
    srcDir('src/t41_recipe_generated/resources')
    // T41 production-lock support slice; catalog fixture is excluded.
    srcDir('src/t41_support_generated/resources')
    // T43 Smelter stone compact families from the immutable production lock.
    srcDir('src/t43_recipe_generated/resources')
    // T43 B1 worldgen support declaration; catalog fixture is excluded.
    srcDir('src/t43_support_generated/resources')
    // T45 block-object compact families from the immutable production lock.
    srcDir('src/t45_recipe_generated/resources')
    // T45 B1 worldgen support declaration; catalog fixture is excluded.
    srcDir('src/t45_support_generated/resources')
    // Shared compact publication/dedup datapack resources (not family JSON).
    srcDir('src/compact_recipe_policy_generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("data/cruciblecraft/recipe/t39_player_path_recovery/**")
    // HashCache lives at <resourcesSrcDir>/.cache; the old src/generated/**/.cache
    // pattern never matched that relative path, so cache files shipped in the jar.
    exclude("**/.cache")
    exclude("**/.cache/**")
}

tasks.withType(ProcessResources).configureEach {
    // Empty material/tag directory shells are not runtime resources.
    includeEmptyDirs = false
}

repositories {
    maven {
        name = 'NeoForgedCdn'
        url = 'https://neoforged.forgecdn.net/releases'
        content {
            includeGroupByRegex 'net\\.neoforged(\\..*)?'
        }
    }
    mavenCentral()
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven {
        name = 'LatvianMods'
        url = 'https://maven.latvian.dev/releases'
        content {
            includeGroup 'dev.latvian.mods'
            includeGroup 'dev.latvian.apps'
        }
    }
    maven {
        name = 'JitPack'
        url = 'https://jitpack.io'
        content {
            includeGroup 'com.github.rtyley'
        }
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            if (providers.gradleProperty('t31Compat').orNull == 'ccOnly') {
                gameDirectory = project.file('run-t31-compat-client')
            } else if (providers.gradleProperty('t31Compat').orNull == 'optional') {
                gameDirectory = project.file('run-t31-compat-client-optional')
            }
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            if (providers.gradleProperty('t31Compat').orNull == 'ccOnly') {
                gameDirectory = project.file('run-t31-compat-server')
            } else if (providers.gradleProperty('t31Compat').orNull == 'optional') {
                gameDirectory = project.file('run-t31-compat-optional')
            }
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            if (providers.gradleProperty('t31Scale').isPresent()) {
                // Isolate the T31 harness from the daily 137-test grid.
                systemProperty 'neoforge.enabledGameTestNamespaces', 'cruciblecraft_scale'
                gameDirectory = project.file('run-t31-scale')
            } else if (providers.gradleProperty('t35Census').isPresent()) {
                // Isolate the T35 runtime registry gate from the daily grid.
                systemProperty 'neoforge.enabledGameTestNamespaces', 'cruciblecraft_census'
                gameDirectory = project.file('run-t35-census')
            } else if (providers.gradleProperty('t36Machines').isPresent()) {
                // Isolate the T36 machine runtime gate from the daily grid.
                systemProperty 'neoforge.enabledGameTestNamespaces', 'cruciblecraft_t36'
                gameDirectory = project.file('run-t36-machines')
            } else if (providers.gradleProperty('t37Recipes').isPresent()) {
                // Isolate the T37 compact-family player-path gate from the daily grid.
                systemProperty 'neoforge.enabledGameTestNamespaces', 'cruciblecraft_t37'
                gameDirectory = project.file('run-t37-recipes')
            } else if (providers.gradleProperty('t38Recipes').isPresent()) {
                // Isolate the T38 compact-family player-path gate from the daily grid.
                systemProperty 'neoforge.enabledGameTestNamespaces', 'cruciblecraft_t38'
                gameDirectory = project.file('run-t38-recipes')
            } else if (providers.gradleProperty('t39Recipes').isPresent()) {
                // Isolate the T39 compact-family player-path gate from the daily grid.
                systemProperty 'neoforge.enabledGameTestNamespaces', 'cruciblecraft_t39'
                gameDirectory = project.file('run-t39-recipes')
            } else if (providers.gradleProperty('t40Recipes').isPresent()) {
                // Isolate the T40 compact-family player-path gate from the daily grid.
                systemProperty 'neoforge.enabledGameTestNamespaces', 'cruciblecraft_t40'
                gameDirectory = project.file('run-t40-recipes')
            } else if (providers.gradleProperty('t41Recipes').isPresent()) {
                // Isolate the T41 compact-family player-path gate from the daily grid.
                systemProperty 'neoforge.enabledGameTestNamespaces', 'cruciblecraft_t41'
                gameDirectory = project.file('run-t41-recipes')
            } else if (providers.gradleProperty('t43Recipes').isPresent()) {
                // Isolate the T43 compact-family player-path gate from the daily grid.
                systemProperty 'neoforge.enabledGameTestNamespaces', 'cruciblecraft_t43'
                gameDirectory = project.file('run-t43-recipes')
            } else if (providers.gradleProperty('t45Recipes').isPresent()) {
                // Isolate the T45 compact-family player-path gate from the daily grid.
                systemProperty 'neoforge.enabledGameTestNamespaces', 'cruciblecraft_t45'
                gameDirectory = project.file('run-t45-recipes')
            } else if (providers.gradleProperty('t44Storage').isPresent()) {
                // Isolate the T44 storage bundle gate from the daily grid.
                systemProperty 'neoforge.enabledGameTestNamespaces', 'cruciblecraft_t44'
                gameDirectory = project.file('run-t44-storage')
            } else {
                systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            }
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
            if (providers.gradleProperty('materialStressScenario').isPresent()) {
                systemProperty 'cruciblecraft.materialStressScenario',
                        providers.gradleProperty('materialStressScenario').get()
                systemProperty 'cruciblecraft.materialStressCount',
                        providers.gradleProperty('materialStressCount').getOrElse('20000')
            }
            if (providers.gradleProperty('t31Scale').isPresent()) {
                systemProperty 'cruciblecraft.t31.scale',
                        providers.gradleProperty('t31Scale').get()
                systemProperty 'cruciblecraft.t31.scale.output',
                        project.file('tools/t31_scale_samples').absolutePath
            }
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

def normalizeResourceJsonNewlines = tasks.register(
        'normalizeResourceJsonNewlines') {
    group = 'verification'
    description = 'Normalizes resource JSON files to repository LF endings.'
    doLast {
        fileTree('src') {
            include '**/*.json'
        }.files.each { generated ->
            String original = generated.getText('UTF-8')
            String normalized = original
                    .replace('\r\n', '\n')
                    .replace('\r', '\n')
            if (normalized != original) {
                generated.write(normalized, 'UTF-8')
            }
        }
    }
}

tasks.named('runData').configure {
    doFirst {
        // Datagen is authoritative for this directory; remove stale files and
        // empty directory shells before producing the next complete snapshot.
        delete file('src/generated/resources')
    }
    finalizedBy normalizeResourceJsonNewlines
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    // Always declare localRuntime so -Pt31Compat=ccOnly can still parse
    // dependencies { localRuntime ... } without putting EMI/Jade on the run.
    localRuntime
    if (providers.gradleProperty('t31Compat').orNull != 'ccOnly') {
        runtimeClasspath.extendsFrom localRuntime
    }
}

dependencies {
    compileOnly 'maven.modrinth:jade:15.10.0+neoforge'
    compileOnly 'maven.modrinth:emi:1.1.24+1.21.1+neoforge'
    compileOnly 'dev.latvian.mods:kubejs-neoforge:2101.7.2-build.368'
    // Dev-only: load optional recipe/HUD mods in runClient without shipping them.
    localRuntime 'maven.modrinth:jade:15.10.0+neoforge'
    localRuntime 'maven.modrinth:emi:1.1.24+1.21.1+neoforge'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'com.mojang:datafixerupper:8.0.16'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Material-rule codec and projection tests exercise the real Minecraft recipe
// types instead of parallel test DTOs.
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath

// T14b prototypes are deliberately isolated from production Minecraft types.
sourceSets {
    t14Benchmark {
        java.srcDir('src/t14Benchmark/java')
    }
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.register('materialRegistryStress', JavaExec) {
    group = 'verification'
    description = 'Runs one manual 20k material registry stress scenario.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.masson.cruciblecraft.material.MaterialRegistryStressHarness'
    args providers.gradleProperty('stressScenario').getOrElse('metadata_only')
    jvmArgs '-Xmx4G'
}

tasks.register('t12CapacityMatcherBenchmark', JavaExec) {
    group = 'verification'
    description = 'Refreshes the repeatable T12a CapacityMatcher benchmark artifact.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.masson.cruciblecraft.recipe.gt.CapacityMatcherBenchmarkHarness'
    args file('tools/t12_capacity_matcher_benchmark.json').absolutePath
}

tasks.register('t14RecipeLoadContractTest', JavaExec) {
    group = 'verification'
    description = 'Runs isolated T14 materialization candidate contract tests.'
    dependsOn tasks.named('t14BenchmarkClasses')
    classpath = sourceSets.t14Benchmark.runtimeClasspath
    mainClass = 'com.masson.cruciblecraft.benchmark.recipe.RecipeFamilyProviderContractTest'
}

def t14RecipeLoadBenchmarkRaw = tasks.register(
        't14RecipeLoadBenchmarkRaw', JavaExec) {
    group = 'verification'
    description = 'Collects T14c measurements from actual compact relations.'
    dependsOn tasks.named('t14BenchmarkClasses')
    classpath = sourceSets.t14Benchmark.runtimeClasspath
    mainClass = 'com.masson.cruciblecraft.benchmark.recipe.RecipeLoadBenchmarkHarness'
    args file('build/t14-benchmark/raw_measurements.json').absolutePath,
            file('tools/t14_materialization_policy.json').absolutePath,
            projectDir.absolutePath,
            file('build/t14-benchmark/jfr').absolutePath
    jvmArgs '-Xms256m', '-Xmx2G', '-XX:+UseG1GC'
    inputs.files file('tools/t14_materialization_policy.json'),
            file('tools/t14_extruder_compact.json')
    outputs.file file('build/t14-benchmark/raw_measurements.json')
}

tasks.register('t37MaterializationMeasurements', Test) {
    group = 'verification'
    description = 'Writes tools/t37_materialization_measurements.json from the 50-row T37 harness.'
    systemProperty 'cruciblecraft.writeT37Measurements', 'true'
    filter {
        includeTestsMatching 'com.masson.cruciblecraft.recipe.gt.CompactRecipeFamilyT37MeasurementHarness'
    }
}

tasks.register('t38MaterializationMeasurements', Test) {
    group = 'verification'
    description = 'Writes tools/t38_materialization_measurements.json from the 73-row T38 harness.'
    systemProperty 'cruciblecraft.writeT38Measurements', 'true'
    filter {
        includeTestsMatching 'com.masson.cruciblecraft.recipe.gt.CompactRecipeFamilyT38MeasurementHarness'
    }
}

tasks.register('t40MaterializationMeasurements', Test) {
    group = 'verification'
    description = 'Writes tools/t40_materialization_measurements.json from the production-lock harness.'
    dependsOn tasks.named('testClasses')
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    systemProperty 'cruciblecraft.writeT40Measurements', 'true'
