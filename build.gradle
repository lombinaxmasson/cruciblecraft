plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.142'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

tasks.withType(Jar).configureEach {
    zip64 = true
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

apply from: 'gradle/scripts/repositories.gradle'
apply from: 'gradle/scripts/source-sets.gradle'
apply from: 'gradle/scripts/runs.gradle'
apply from: 'gradle/scripts/dependencies.gradle'
apply from: 'gradle/scripts/verification.gradle'
apply from: 'gradle/scripts/publishing.gradle'
apply from: 'gradle/scripts/incremental-resources.gradle'
apply from: 'gradle/scripts/release-resources.gradle'
