// Frozen generated resource roots. Keep this list identical to
// tools/generated_resource_roots.json. Do not add src/<name>_generated siblings.
sourceSets.main.resources {
    srcDir('src/generated/resources')
    srcDir('src/ore_chain_generated/resources')
    srcDir('src/worldgen_generated/resources')
    srcDir('src/worldgen_catalog_generated/resources')
    srcDir('src/component_rule_generated/resources')
    srcDir('src/chemical_recipe_generated/resources')
    srcDir('src/hydrocarbon_recipe_generated/resources')
    srcDir('src/petroleum_recipe_generated/resources')
    srcDir('src/compact_recipe_policy_generated/resources')
    srcDir('src/recipe_generated/resources')
    srcDir('src/recipe_support_generated/resources')

    exclude("**/*.bbmodel")
    exclude("data/cruciblecraft/recipe/player_path_recovery/roaster/**")
    exclude("**/.cache")
    exclude("**/.cache/**")
    exclude("**/.gitkeep")
}

def generatedResourceRoots = new groovy.json.JsonSlurper().parse(
        file('tools/generated_resource_roots.json'))
def resourceSourceRoots = [file('src/main/resources')]
generatedResourceRoots.roots.each { row ->
    resourceSourceRoots << file(row.path as String)
}

def resourceDuplicateStamp = layout.buildDirectory.file(
        'verification/resource-duplicates.ok')
def checkResourceDuplicates = tasks.register('checkResourceDuplicates', Exec) {
    group = 'verification'
    description = 'Fails if two resource roots share a relative path.'
    workingDir rootDir
    commandLine 'python', 'tools/build_generated_resource_gate.py',
            '--check-duplicates',
            '--stamp', resourceDuplicateStamp.get().asFile.absolutePath
    resourceSourceRoots.each { root ->
        if (root.directory) {
            inputs.dir(root)
        }
    }
    inputs.files 'tools/generated_resource_roots.json',
            'tools/generated_resource_gate.py',
            'tools/build_generated_resource_gate.py'
    outputs.file resourceDuplicateStamp
}

tasks.withType(ProcessResources).configureEach {
    includeEmptyDirs = false
    duplicatesStrategy = DuplicatesStrategy.FAIL
    dependsOn checkResourceDuplicates
}

sourceSets {
    recipeLoadBenchmark {
        java.srcDir('src/recipeLoadBenchmark/java')
    }
}
