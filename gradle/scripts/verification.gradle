tasks.named('test', Test).configure {
    useJUnitPlatform()
    maxHeapSize = '6g'
    filter {
        excludeTestsMatching 'com.masson.cruciblecraft.recipe.gt.OrdinaryCloseoutIntegratedMeasurementHarness'
    }
}

tasks.register('materialRegistryStress', JavaExec) {
    group = 'verification'
    description = 'Runs one manual 20k material registry stress scenario.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.masson.cruciblecraft.material.MaterialRegistryStressHarness'
    args providers.gradleProperty('stressScenario').getOrElse('metadata_only')
    jvmArgs '-Xmx4G'
}

